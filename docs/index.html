<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f6b5c">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<style>html,body{margin:0}body{padding-top:env(safe-area-inset-top,0px)}[hidden]{display:none!important}</style>
<script>if('serviceWorker' in navigator){addEventListener('load',function(){navigator.serviceWorker.register('sw.js')})}</script>
<title>ميزانيتي</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ميزانيتي">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Readex+Pro:wght@400;500;600;700&display=swap">
<style>
/* Layout: one phone-width column (max 34rem) with a fixed bottom tab bar; ledger-like rows, one hero budget gauge. */
:root {
  --bg: #eef2ef;
  --surface: #fbfcfa;
  --surface-2: #f3f6f3;
  --ink: #0f1f1b;
  --ink-2: #44554f;
  --muted: #7b8983;
  --line: #dde4df;
  --accent: #0f6b5c;
  --accent-ink: #ffffff;
  --accent-soft: #d9ebe5;
  --good: #0a8a3a;
  --good-soft: #dff3e6;
  --warn: #b77a00;
  --warn-mark: #fab219;
  --warn-soft: #fdf1d3;
  --bad: #c73434;
  --bad-soft: #f9e0de;
  --income: #0a7d55;
  --shadow: 0 1px 2px rgba(15, 31, 27, .06), 0 6px 20px rgba(15, 31, 27, .06);
  --f-display: "Readex Pro", "IBM Plex Sans Arabic", system-ui, sans-serif;
  --f-body: "IBM Plex Sans Arabic", "Segoe UI", Tahoma, system-ui, sans-serif;
  --r: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c1311; --surface: #141d1a; --surface-2: #1a2521; --ink: #edf3f0; --ink-2: #b2c1bb; --muted: #7f8e88;
    --line: #25312d; --accent: #4cc2a6; --accent-ink: #062019; --accent-soft: #173a32; --good: #3ccf6e; --good-soft: #13301f;
    --warn: #f3b73c; --warn-mark: #fab219; --warn-soft: #33290f; --bad: #ef6b6b; --bad-soft: #3a1c1c; --income: #4fd29a;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 20px rgba(0, 0, 0, .25); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c1311; --surface: #141d1a; --surface-2: #1a2521; --ink: #edf3f0; --ink-2: #b2c1bb; --muted: #7f8e88;
  --line: #25312d; --accent: #4cc2a6; --accent-ink: #062019; --accent-soft: #173a32; --good: #3ccf6e; --good-soft: #13301f;
  --warn: #f3b73c; --warn-mark: #fab219; --warn-soft: #33290f; --bad: #ef6b6b; --bad-soft: #3a1c1c; --income: #4fd29a;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 20px rgba(0, 0, 0, .25); color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--ink); }
body { font-family: var(--f-body); font-size: 15px; line-height: 1.6; -webkit-text-size-adjust: 100%; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-family: var(--f-display); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 13px; }

.wrap { max-width: 34rem; margin: 0 auto; padding-inline: 16px; padding-block: 12px calc(96px + env(safe-area-inset-bottom, 0px)); }

/* header */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 6px 14px; }
.brand { display: flex; align-items: center; gap: 10px; }
.brand-mark { width: 36px; height: 36px; border-radius: 10px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-family: var(--f-display); font-weight: 700; font-size: 18px; }
.brand h1 { margin: 0; font-family: var(--f-display); font-size: 20px; font-weight: 600; line-height: 1.2; }
.brand .sub { font-size: 12px; color: var(--muted); }
.chip-store { font-size: 12px; color: var(--ink-2); background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; white-space: nowrap; }

/* period switcher */
.period { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-block: 4px 12px; }
.period .label { font-family: var(--f-display); font-weight: 500; font-size: 16px; text-align: center; flex: 1; min-width: 0; }
.iconbtn { width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; font-size: 18px; line-height: 1; }
.iconbtn:disabled { opacity: .35; cursor: default; }

section[data-tab] { display: grid; gap: 14px; }
section[data-tab][hidden], [hidden] { display: none !important; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; min-width: 0; }
.card h2 { margin: 0 0 10px; font-size: 15px; font-weight: 600; font-family: var(--f-display); display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.card h2 .link { font-family: var(--f-body); font-weight: 500; font-size: 13px; color: var(--accent); background: none; border: 0; padding: 0; }

/* hero gauge */
.hero { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 18px 16px 16px; box-shadow: var(--shadow); }
.hero .eyebrow { font-size: 13px; color: var(--ink-2); }
.hero .big { font-family: var(--f-display); font-size: clamp(34px, 11vw, 46px); font-weight: 600; line-height: 1.1; margin-block: 4px 2px; letter-spacing: -.5px; }
.hero .big .cur { font-size: .42em; font-weight: 400; color: var(--muted); margin-inline-start: 4px; }
.hero .big.neg { color: var(--bad); }
.gauge { position: relative; height: 14px; border-radius: 7px; background: var(--surface-2); border: 1px solid var(--line); margin-block: 16px 6px; overflow: visible; }
.gauge .fill { position: absolute; inset-block: 0; inset-inline-start: 0; border-radius: 7px; background: var(--accent); transition: width .5s ease; }
.gauge .fill.warn { background: var(--warn-mark); }
.gauge .fill.bad { background: var(--bad); }
.gauge .pace { position: absolute; top: -6px; bottom: -6px; width: 2px; background: var(--ink); border-radius: 1px; }
.gauge .pace::after { content: attr(data-label); position: absolute; top: -20px; transform: translateX(50%); font-size: 11px; color: var(--ink-2); white-space: nowrap; }
.gauge-legend { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; color: var(--ink-2); flex-wrap: wrap; }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 500; border-radius: 999px; padding: 3px 10px; }
.pill.good { background: var(--good-soft); color: var(--good); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.hero-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }

.stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px; min-width: 0; }
.stat .k { font-size: 12.5px; color: var(--ink-2); }
.stat .v { font-family: var(--f-display); font-size: 20px; font-weight: 500; line-height: 1.3; margin-top: 2px; overflow-wrap: anywhere; }
.stat .v small { font-size: 12px; color: var(--muted); font-weight: 400; }
.stat .h { font-size: 12px; color: var(--muted); }

.banner { border-radius: 12px; padding: 12px 14px; font-size: 14px; display: flex; gap: 10px; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; }
.banner.sample { background: var(--accent-soft); color: var(--ink); }
.banner.warn { background: var(--warn-soft); }
.banner.bad { background: var(--bad-soft); }
.banner b { font-weight: 600; }

/* category bars */
.cats { display: grid; gap: 12px; }
.catrow { display: grid; grid-template-columns: 32px minmax(0, 1fr) auto; gap: 4px 10px; align-items: center; }
.catrow .ic { grid-row: span 2; width: 32px; height: 32px; border-radius: 9px; background: var(--surface-2); display: grid; place-items: center; font-size: 16px; }
.catrow .nm { font-size: 14px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.catrow .amt { font-family: var(--f-display); font-size: 14px; text-align: end; font-variant-numeric: tabular-nums; }
.catrow .bar { grid-column: 2 / 4; height: 6px; background: var(--surface-2); border-radius: 3px; position: relative; overflow: hidden; }
.catrow .bar i { position: absolute; inset-block: 0; inset-inline-start: 0; background: var(--accent); border-radius: 3px; }
.catrow .bar i.warn { background: var(--warn-mark); }
.catrow .bar i.bad { background: var(--bad); }
.catrow .meta { grid-column: 2 / 4; font-size: 12px; color: var(--muted); margin-top: -2px; }

/* transactions */
.day { display: grid; gap: 2px; }
.dayhead { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--muted); padding-block: 8px 4px; border-bottom: 1px solid var(--line); }
.tx { display: grid; grid-template-columns: 38px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 10px 2px; border: 0; background: none; text-align: start; width: 100%; border-bottom: 1px dashed var(--line); }
.tx:last-child { border-bottom: 0; }
.tx .ic { width: 38px; height: 38px; border-radius: 11px; background: var(--surface-2); display: grid; place-items: center; font-size: 18px; }
.tx .t1 { font-size: 14.5px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tx .t2 { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tx .a { font-family: var(--f-display); font-variant-numeric: tabular-nums; font-size: 15px; text-align: end; white-space: nowrap; }
.tx .a.in { color: var(--income); }
.tx .src { font-size: 11px; color: var(--muted); display: block; text-align: end; }
.empty { text-align: center; color: var(--muted); padding: 24px 8px; font-size: 14px; }

.filters { display: grid; gap: 8px; }
.segs { display: flex; gap: 6px; flex-wrap: wrap; }
.seg { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 14px; font-size: 13.5px; }
.seg[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.field { display: grid; gap: 4px; min-width: 0; }
.field label, .lbl { font-size: 13px; color: var(--ink-2); }
input[type=text], input[type=search], input[type=number], input[type=datetime-local], select, textarea {
  width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 10px 12px; font-size: 16px; min-width: 0;
}
textarea { resize: vertical; min-height: 150px; line-height: 1.7; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: transparent; }
.row2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.btn { border: 0; border-radius: 12px; padding: 12px 18px; font-weight: 600; background: var(--accent); color: var(--accent-ink); font-size: 15px; }
.btn.ghost { background: var(--surface-2); color: var(--ink); border: 1px solid var(--line); font-weight: 500; }
.btn.danger { background: var(--bad); color: #fff; }
.btn.block { width: 100%; }
.btns { display: flex; gap: 8px; flex-wrap: wrap; }
.amount-in { font-family: var(--f-display); font-size: 30px !important; text-align: center; padding: 12px !important; }
.catgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }
.catbtn { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 8px 4px; display: grid; justify-items: center; gap: 2px; font-size: 12.5px; line-height: 1.3; min-height: 64px; }
.catbtn .e { font-size: 20px; }
.catbtn[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent); }

.parsed { display: grid; gap: 10px; }
.pcard { border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: grid; gap: 8px; background: var(--surface); }
.pcard.off { opacity: .55; }
.pcard.err { border-style: dashed; }
.pcard .raw { font-size: 12px; color: var(--muted); white-space: pre-line; max-height: 4.8em; overflow: hidden; }
.pcard .head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.warnline { font-size: 12.5px; color: var(--warn); }
.errline { font-size: 13px; color: var(--bad); }
.check { display: inline-flex; align-items: center; gap: 6px; font-size: 13.5px; }
.check input { width: 18px; height: 18px; accent-color: var(--accent); }

/* charts */
.chart { position: relative; width: 100%; }
.chart svg { display: block; width: 100%; overflow: visible; }
.chart text { fill: var(--muted); font-size: 11px; font-family: var(--f-body); }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .base { stroke: var(--muted); stroke-width: 1; }
.tip { position: absolute; pointer-events: none; background: var(--ink); color: var(--bg); border-radius: 8px; padding: 6px 10px; font-size: 12.5px; line-height: 1.5; white-space: nowrap; transform: translate(50%, -100%); z-index: 3; }
.tip[hidden] { display: none; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12.5px; color: var(--ink-2); margin-top: 8px; }
.legend i { display: inline-block; width: 14px; height: 3px; border-radius: 2px; vertical-align: middle; margin-inline-end: 6px; background: var(--accent); }
.legend i.dash { background: repeating-linear-gradient(90deg, var(--muted) 0 4px, transparent 4px 7px); }
.legend i.bad { background: var(--bad); height: 8px; }
.legend i.bar { height: 8px; }

.tbl { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { font-weight: 500; font-size: 12.5px; color: var(--muted); text-align: start; padding: 6px 4px; border-bottom: 1px solid var(--line); }
td { padding: 8px 4px; border-bottom: 1px solid var(--line); }
td.n, th.n { text-align: end; font-family: var(--f-display); font-variant-numeric: tabular-nums; white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
.delta-up { color: var(--bad); }
.delta-down { color: var(--good); }

.kv { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }

/* settings */
.set-list { display: grid; gap: 10px; }
.setrow { display: grid; grid-template-columns: 30px minmax(0, 1fr) 110px; gap: 10px; align-items: center; }
.setrow input { padding: 8px 10px; font-size: 15px; }
.steps { margin: 0; padding-inline-start: 20px; display: grid; gap: 8px; font-size: 14px; }
.steps code, .mono { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12.5px; background: var(--surface-2); padding: 1px 6px; border-radius: 6px; }
details.card summary { cursor: pointer; font-family: var(--f-display); font-weight: 600; font-size: 15px; }
details.card[open] summary { margin-bottom: 10px; }
.rule { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 14px; padding-block: 6px; border-bottom: 1px solid var(--line); }
.rule:last-child { border-bottom: 0; }
.rule span { min-width: 0; overflow-wrap: anywhere; }

/* bottom nav */
nav.tabs { position: fixed; inset-inline: 0; bottom: 0; z-index: 10; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
nav.tabs .in { max-width: 34rem; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); }
nav.tabs button { border: 0; background: none; padding: 8px 2px 10px; display: grid; justify-items: center; gap: 2px; font-size: 11.5px; color: var(--muted); }
nav.tabs button svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
nav.tabs button[aria-current="page"] { color: var(--accent); font-weight: 600; }
nav.tabs .add span.plus { width: 44px; height: 44px; margin-top: -18px; border-radius: 14px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; box-shadow: var(--shadow); }
nav.tabs .add span.plus svg { stroke: var(--accent-ink); }

/* sheet */
.sheet-bg { position: fixed; inset: 0; background: rgba(8, 16, 13, .45); z-index: 20; display: grid; align-items: end; justify-items: center; }
.sheet { background: var(--bg); width: 100%; max-width: 34rem; max-height: 92%; overflow-y: auto; border-radius: 18px 18px 0 0; padding: 16px 16px calc(20px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 12px; }
.sheet h3 { margin: 0; font-family: var(--f-display); font-size: 17px; font-weight: 600; display: flex; justify-content: space-between; align-items: center; }
.toast { position: fixed; bottom: calc(84px + env(safe-area-inset-bottom, 0px)); inset-inline: 16px; margin: 0 auto; max-width: 30rem; background: var(--ink); color: var(--bg); border-radius: 12px; padding: 10px 14px; font-size: 14px; z-index: 30; text-align: center; }

@media (min-width: 560px) {
  .stats { grid-template-columns: repeat(4, minmax(0, 1fr)); }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<div dir="rtl" lang="ar">
<div class="wrap">
  <header class="top">
    <div class="brand"><div class="brand-mark" aria-hidden="true">م</div><div><h1>ميزانيتي</h1><div class="sub" id="hijri"></div></div></div>
    <span class="chip-store" id="storechip">جارِ التحميل…</span>
  </header>
  <main>
    <section data-tab="home"></section>
    <section data-tab="txns" hidden></section>
    <section data-tab="add" hidden></section>
    <section data-tab="reports" hidden></section>
    <section data-tab="settings" hidden></section>
  </main>
</div>
<nav class="tabs" aria-label="التنقل">
  <div class="in">
    <button data-go="home"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>الرئيسية</button>
    <button data-go="txns"><svg viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></svg>العمليات</button>
    <button data-go="add" class="add" aria-label="إضافة عملية"><span class="plus"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></span>إضافة</button>
    <button data-go="reports"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>التقارير</button>
    <button data-go="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>الإعدادات</button>
  </div>
</nav>
<div id="sheet" hidden></div>
<div class="toast" id="toast" hidden role="status"></div>
</div>
<script>
// ===== محلل رسائل البنوك + التصنيف التلقائي =====
// Pure functions: no DOM. Tested with node (test/parser.test.js).

const CATEGORIES = [
  // id, Arabic name, icon glyph, kind
  { id: 'groceries', name: 'بقالة وتموينات', icon: '🛒', kind: 'expense' },
  { id: 'restaurants', name: 'مطاعم', icon: '🍽', kind: 'expense' },
  { id: 'coffee', name: 'قهوة وكافيهات', icon: '☕', kind: 'expense' },
  { id: 'delivery', name: 'تطبيقات توصيل', icon: '🛵', kind: 'expense' },
  { id: 'fuel', name: 'وقود', icon: '⛽', kind: 'expense' },
  { id: 'transport', name: 'مواصلات وتنقل', icon: '🚕', kind: 'expense' },
  { id: 'car', name: 'سيارة وصيانة', icon: '🔧', kind: 'expense' },
  { id: 'shopping', name: 'تسوق', icon: '🛍', kind: 'expense' },

const DEFAULT_KIND_CAT = { expense: 'other', income: 'income_other' };

// ---- text normalisation ----
function normalizeDigits(s) {
  return String(s || '')
    .replace(/[٠-٩]/g, (d) => String(d.charCodeAt(0) - 0x0660))
    .replace(/[۰-۹]/g, (d) => String(d.charCodeAt(0) - 0x06F0))
    .replace(/٫/g, '.') // Arabic decimal separator
    .replace(/[٬،]/g, ',') // Arabic thousands separator / comma
    .replace(/ـ/g, '') // tatweel
    .replace(/[‎‏‪-‮⁦-⁩]/g, ''); // bidi marks
}

function normalizeMerchant(s) {
  return normalizeDigits(s).toLowerCase().replace(/[\s\-_.*#]+/g, ' ').replace(/\s\d{3,}$/, '').trim();
}

function hashText(s) {
  const t = normalizeDigits(s).replace(/\s+/g, ' ').trim().toLowerCase();
  let h = 5381;
  for (let i = 0; i < t.length; i++) h = ((h << 5) + h + t.charCodeAt(i)) | 0;
  return 'h' + (h >>> 0).toString(36) + t.length.toString(36);
}

// ---- category detection ----
function findCat(text) {
  let best = null, bestLen = 0;
  for (const [cat, words] of Object.entries(CATEGORY_KEYWORDS)) {
    for (const w of words) {
      if (w.length > bestLen && matchesWord(text, w)) { best = cat; bestLen = w.length; }
    }
  }
  return best;
}

function categorize(merchant, fullText, kind, rules) {
  const m = normalizeMerchant(merchant);
  if (rules && m && rules[m]) return rules[m];
  const byMerchant = m && findCat(m);
  if (byMerchant) return byMerchant;
  if (kind === 'expense' && fullText) {
    // Payment-method words ("stc pay", "apple pay") must not decide the category.
    const t = normalizeDigits(fullText).toLowerCase().replace(/(stc\s*pay|apple\s*pay|اس تي سي باي|ابل باي|أبل باي)/g, ' ');
    const byText = findCat(t);
    if (byText) return byText;
  }
  return DEFAULT_KIND_CAT[kind] || 'other';
}

function escRe(w) { return w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
function matchesWord(text, w) {
  // Whole-word match in both scripts, so "stc" doesn't hit "castcom" and "نون" doesn't hit "قانون".
  const L = /^[a-z0-9&.' ]+$/.test(w) ? 'a-z0-9' : '\u0621-\u064Aa-z0-9';
  const re = new RegExp('(^|[^' + L + '])' + escRe(w) + '($|[^' + L + '])');
  return re.test(text);
}

// ---- SMS parsing ----
const CUR = '(SAR|SR|S\\.R|ر\\.?\\s?س\\.?|ريال|رس|USD|US\\$|EUR|AED|GBP|KWD|BHD|QAR|OMR|EGP|JOD|TRY|\\$|€|£)';
const NUM = '(\\d+(?:\\.\\d{1,3})?)';

function curCode(c) {
  if (!c) return null;
  c = c.replace(/\s/g, '').toUpperCase();
  if (/^(SAR|SR|S\.R|ر\.?س\.?|ريال|رس)$/i.test(c) || /ر.?س/.test(c) || c === 'ريال') return 'SAR';
  if (c === '$' || c === 'US$') return 'USD';
  if (c === '€') return 'EUR';
  if (c === '£') return 'GBP';
  return c;
}

function extractAmount(text) {
  // Drop balance / available-limit fragments so they are never read as the amount.
  const t = text
    .replace(/(الرصيد|رصيد|المتاح|الحد المتاح|Balance|Bal\b|Avail[a-z.]*\s*(?:Bal[a-z.]*|limit)?)[^\n]*/gi, '')
    .replace(/(\d),(?=\d{3}(?!\d))/g, '$1');
  const found = [];
  const push = (re, ai, ci, ci2, weight) => {
    let m; re.lastIndex = 0;
    while ((m = re.exec(t))) found.push({ amount: parseFloat(m[ai]), cur: curCode(m[ci] || (ci2 ? m[ci2] : null)), idx: m.index, weight });
  };
  push(new RegExp('(?:مبلغ|المبلغ|بمبلغ|بقيمة|القيمة|قيمة|Amount|Amt|بـ)\\s*[:：]?\\s*' + CUR + '?\\s*' + NUM + '\\s*' + CUR + '?', 'gi'), 2, 1, 3, 3);
  push(new RegExp(CUR + '\\s*' + NUM, 'gi'), 2, 1, null, 2);
  push(new RegExp(NUM + '\\s*' + CUR, 'gi'), 1, 2, null, 2);
  const valid = found.filter((f) => f.amount > 0 && f.amount < 10000000);
  if (!valid.length) return null;
  // Prefer: labelled, then SAR, then earliest.
  valid.sort((a, b) => (b.weight - a.weight) || ((b.cur === 'SAR') - (a.cur === 'SAR')) || (a.idx - b.idx));
  const best = valid[0];
  // A labelled amount without currency: take currency from a currency match of the same number.
  if (!best.cur) {
    const same = valid.find((v) => v.amount === best.amount && v.cur);
    best.cur = same ? same.cur : 'SAR';
  }
  return { amount: Math.round(best.amount * 100) / 100, currency: best.cur };
}

const RX = {
  ignore: /(رمز\s*(التحقق|التفعيل|الدخول|سري)|كلمة\s*(المرور|السر)|OTP|one[- ]time|verification code|passcode|لا تشارك|do not share|مرفوض|رفض|declined|لم تتم|insufficient|غير كاف)/i,
  refund: /(استرداد|مسترد|مسترجع|استرجاع|refund|reversal|reversed|عكس عملية)/i,
  income: /(راتب|salary|payroll|إيداع|ايداع|deposit|حوالة\s*واردة|حواله\s*وارده|تحويل\s*وارد|واردة|incoming|credited|credit transfer|received|استلام|أضيف|اضافة مبلغ|إضافة مبلغ)/i,
  withdraw: /(سحب|ATM|withdraw)/i,
  transfer: /(حوالة|حواله|تحويل|transfer|صادرة|outgoing|sent to|إلى حساب|الى حساب)/i,
  bill: /(سداد|فاتورة|sadad|bill payment)/i,
};

function detectType(text) {
  if (RX.refund.test(text)) return { kind: 'income', sub: 'refund' };
  if (RX.income.test(text) && !/(شراء|purchase|POS)/i.test(text)) {
    return { kind: 'income', sub: /(راتب|salary|payroll)/i.test(text) ? 'salary' : RX.transfer.test(text) ? 'transfer_in' : 'income_other' };
  }
  if (RX.withdraw.test(text) && !/(شراء|purchase)/i.test(text)) return { kind: 'expense', sub: 'cash' };
  if (RX.bill.test(text)) return { kind: 'expense', sub: 'bill' };
  if (RX.transfer.test(text) && !/(شراء|purchase|POS)/i.test(text)) return { kind: 'expense', sub: 'transfer' };
  return { kind: 'expense', sub: 'purchase' };
}

const MERCHANT_LABEL = /^\s*(?:لدى|لدي|عند|من|المتجر|التاجر|اسم التاجر|الجهة|المفوتر|إلى|الى|المستفيد|لـ|At|Merchant|From|To|Beneficiary|Biller|Payee)\s*[:：]?\s*(.+?)\s*$/i;

function badMerchant(v) {
  const s = normalizeDigits(v).trim();
  if (!s || s.length < 2) return true;
  if (/^[\d\s*xX#:/.\-]+$/.test(s)) return true; // only digits / masks
  if (/^(حساب|بطاقة|البطاقة|الحساب|account|card|acc|a\/c|iban|رقم)/i.test(s)) return true;
  if (/^\d{1,4}[-/]\d{1,2}[-/]\d{1,4}/.test(s)) return true; // a date
  if (/^(SAR|ر\.?س|ريال)\s*\d/i.test(s)) return true;
  return false;
}

function cleanMerchant(v) {
  return normalizeDigits(v)
    .replace(/\s+(?:في|on|بتاريخ|date|at\s+\d).*$/i, '')
    .replace(/\s+\d{1,2}:\d{2}.*$/, '')
    .replace(/[;,|]+$/, '')
    .replace(/\s{2,}/g, ' ')
    .trim()
    .slice(0, 60);
}

function extractMerchant(text) {
  const lines = text.split(/\n|\r/).map((l) => l.trim()).filter(Boolean);
  for (const line of lines) {
    const m = line.match(MERCHANT_LABEL);
    if (m && !badMerchant(m[1])) return cleanMerchant(m[1]);
  }
  const inline = [
    /\b(?:at|from|to)\s+([A-Za-z؀-ۿ0-9&'. \-]{2,40}?)(?=\s+(?:on|with|using|card|via)\b|\s*[,.;\n]|\s+\d|$)/i,
    /(?:لدى|لدي|عند|المتجر|من)\s*[:：]?\s*([^\n,،;]{2,40}?)(?=\s+(?:في|على|بتاريخ|بمبلغ|بقيمة|مبلغ)(?:\s|$)|\s*[,،;\n]|$)/,
  ];
  for (const re of inline) {
    const m = text.match(re);
    if (m && !badMerchant(m[1])) return cleanMerchant(m[1]);
  }
  return '';
}

function extractMethod(text) {
  const t = text.toLowerCase();
  const brands = [];
  if (/mada|مدى/.test(t)) brands.push('مدى');
  if (/visa|فيزا/.test(t)) brands.push('فيزا');
  if (/master|ماستر/.test(t)) brands.push('ماستركارد');
  if (/amex|american express|أمريكان/.test(t)) brands.push('أمريكان إكسبريس');
  if (/apple\s*pay|أبل باي|ابل باي|آبل باي/.test(t)) brands.push('Apple Pay');
  if (/stc\s*pay|اس تي سي باي/.test(t)) brands.push('STC Pay');
  const brand = brands.join(' · ');
  const m = normalizeDigits(text).match(/(?:\*+|x{2,}|بطاقة\s*[:：]?\s*\**|البطاقة\s*[:：]?\s*\**|card\s*(?:no\.?|number)?\s*[:：]?\s*\**|ending\s*(?:with|in)?\s*|تنتهي\s*(?:بـ|ب)?\s*)(\d{4})\b/i);
  const last4 = m ? m[1] : '';
  return [brand, last4 ? '•' + last4 : ''].filter(Boolean).join(' ');
}

function pad(n) { return String(n).padStart(2, '0'); }
function isoLocal(d) {
  return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + 'T' + pad(d.getHours()) + ':' + pad(d.getMinutes());
}

function extractDate(text, now) {
  now = now || new Date();
  const t = normalizeDigits(text);
  const tm = t.match(/(\d{1,2}):(\d{2})(?::\d{2})?\s*(ص|م|am|pm)?/i);
  let hh = tm ? +tm[1] : now.getHours(), mi = tm ? +tm[2] : now.getMinutes();
  if (tm && tm[3]) {
    const pm = /م|pm/i.test(tm[3]);
    if (pm && hh < 12) hh += 12;
    if (!pm && hh === 12) hh = 0;
  }
  const cands = [];
  const add = (y, m, d) => {
    if (y < 100) y += 2000;
    if (m < 1 || m > 12 || d < 1 || d > 31) return;
    const dt = new Date(y, m - 1, d, hh, mi);
    if (dt.getMonth() !== m - 1) return;
    cands.push(dt);
  };
  let m;
  const re4 = /(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})/g;
  while ((m = re4.exec(t))) add(+m[1], +m[2], +m[3]);
  if (!cands.length) {
    const re2 = /(\d{1,2})[-/.](\d{1,2})[-/.](\d{2,4})/g;
    while ((m = re2.exec(t))) {
      add(+m[3], +m[2], +m[1]); // d/m/y
      if (m[3].length === 2) add(+m[1], +m[2], +m[3]); // yy-mm-dd
    }
  }
  const limit = now.getTime() + 36 * 3600 * 1000;
  const ok = cands.filter((d) => d.getTime() <= limit && now.getTime() - d.getTime() < 400 * 86400000);
  if (!ok.length) {
    const d = new Date(now);
    if (tm) d.setHours(hh, mi, 0, 0);
    return { date: isoLocal(d), guessed: true };
  }
  ok.sort((a, b) => Math.abs(now - a) - Math.abs(now - b));
  return { date: isoLocal(ok[0]), guessed: false };
}

function detectBank(text) {
  const t = text.toLowerCase();
  const banks = [
    ['الراجحي', /rajhi|الراجحي/], ['الأهلي', /snb|alahli|الأهلي|الاهلي/], ['الرياض', /riyad ?bank|بنك الرياض/],
    ['الإنماء', /alinma|الإنماء|الانماء/], ['ساب', /\bsab\b|ساب/], ['البلاد', /albilad|البلاد/],
    ['الجزيرة', /aljazira|الجزيرة/], ['العربي', /anb|العربي الوطني/], ['السعودي الفرنسي', /bsf|الفرنسي/],
    ['STC Bank', /stc ?bank|stc ?pay|اس تي سي/], ['D360', /d360/], ['الاستثمار', /saib|الاستثمار/],
  ];
  for (const [name, re] of banks) if (re.test(t)) return name;
  return '';
}

function parseSms(raw, opts) {
  opts = opts || {};
  const text = normalizeDigits(raw).trim();
  const out = { raw: String(raw).trim(), hash: hashText(raw), ok: false, warnings: [] };
  if (!text) { out.error = 'رسالة فارغة'; return out; }
  if (RX.ignore.test(text)) { out.error = 'رسالة رمز تحقق أو عملية مرفوضة — تم تجاهلها'; out.ignored = true; return out; }
  const amt = extractAmount(text);
  if (!amt) { out.error = 'لم أتعرف على المبلغ في هذه الرسالة'; return out; }
  const type = detectType(text);
  const merchant = extractMerchant(text);
  const date = extractDate(text, opts.now);
  let cat;
  if (type.kind === 'income') cat = type.sub === 'salary' ? 'salary' : type.sub === 'refund' ? 'refund' : type.sub === 'transfer_in' ? 'transfer_in' : 'income_other';
  else if (type.sub === 'cash') cat = 'cash';
  else if (type.sub === 'transfer') cat = categorize(merchant, '', 'expense', opts.rules);
  else cat = categorize(merchant, text, 'expense', opts.rules);
  if (type.sub === 'transfer' && cat === 'other') cat = 'transfers';
  if (type.sub === 'bill' && cat === 'other') cat = 'bills';
  if (amt.currency !== 'SAR') out.warnings.push('المبلغ بعملة ' + amt.currency + ' — عدّله إلى الريال إن لزم');
  if (date.guessed) out.warnings.push('لم أجد تاريخاً في الرسالة، استخدمت تاريخ اليوم');
  Object.assign(out, {
    ok: true,
    type: type.kind,
    amount: amt.amount,
    currency: amt.currency,
    merchant: merchant || (type.sub === 'cash' ? 'صراف آلي' : type.sub === 'transfer' ? 'حوالة' : type.sub === 'salary' ? 'راتب' : ''),
    cat,
    date: date.date,
    method: extractMethod(text),
    bank: detectBank(text),
  });
  return out;
}

// Several messages pasted together: split on blank lines, or before a new "header" line.
function splitMessages(raw) {
  const t = String(raw || '').replace(/\r\n?/g, '\n').trim();
  if (!t) return [];
  let parts = t.split(/\n\s*\n+/);
  if (parts.length === 1) {
    // No blank lines. If several amount lines exist, split before recognised header words.
    const amountLines = (t.match(/(مبلغ|Amount|SAR|ر\.س)/gi) || []).length;
    if (amountLines > 2) {
      const header = /^(شراء|سحب|حوالة|حواله|تحويل|إيداع|ايداع|استرداد|سداد|راتب|POS|Purchase|Online Purchase|ATM|Transfer|Refund|Deposit|Salary|Payment)/i;
      const lines = t.split('\n');
      parts = []; let cur = [];
      for (const l of lines) {
        if (header.test(l.trim()) && cur.length) { parts.push(cur.join('\n')); cur = []; }
        cur.push(l);
      }
      if (cur.length) parts.push(cur.join('\n'));
    }
  }
  return parts.map((p) => p.trim()).filter(Boolean);
}

  function renderParsed() {

        ${r.dup ? '<div class="warnline">⚠ هذه الرسالة مسجلة مسبقاً — لن تُحفظ مرتين إلا إذا فعّلتها</div>' : ''}
        ${r.warnings.map((w) => `<div class="warnline">⚠ ${esc(w)}</div>`).join('')}
        <div class="row2">
          <div class="field"><label for="p-m-${i}">المتجر</label><input id="p-m-${i}" type="text" dir="auto" data-pf="merchant" data-pi="${i}" value="${esc(r.merchant)}"></div>
          <div class="field"><label for="p-a-${i}">المبلغ (ر.س)</label><input id="p-a-${i}" type="text" inputmode="decimal" data-pf="amount" data-pi="${i}" value="${esc(r.amount)}"></div>

          <div class="field"><label for="p-d-${i}">التاريخ</label><input id="p-d-${i}" type="datetime-local" data-pf="date" data-pi="${i}" value="${esc(r.date)}"></div>
        </div>
        <div class="raw" dir="auto">${esc(r.raw)}</div>

    }).join('')}
    ${n ? `<button class="btn block" data-act="save-parsed">حفظ ${fmt(n, 0)} ${n === 1 ? 'عملية' : 'عمليات'}</button>` : ''}</div>`;

  // ----- reports -----
  function renderReports(el) {
    const p = periodAt(state.offset);
    const list = inPeriod(p);
    const { exp, inc, byCat } = sums(list);
    const prev = sums(inPeriod(periodAt(state.offset - 1)));
    const merchants = {};
    list.filter((t) => t.type !== 'income').forEach((t) => {
      const k = t.merchant || CAT[t.cat]?.name || '—';
      const m = (merchants[k] = merchants[k] || { n: 0, v: 0, cat: t.cat }); m.n++; m.v += t.amount;
    });
    const top = Object.entries(merchants).sort((a, b) => b[1].v - a[1].v).slice(0, 8);
    const net = inc - exp;
    el.innerHTML = `${periodBar()}${sampleBanner()}
    <div class="card"><h2>ملخص الفترة</h2>
      <div class="kv">
        <div><div class="small muted">الدخل</div><div class="num" style="font-size:19px;color:var(--income)">${moneyTxt(inc, 0)}</div></div>
        <div><div class="small muted">المصروف</div><div class="num" style="font-size:19px">${moneyTxt(exp, 0)}</div></div>
        <div><div class="small muted">صافي ${net >= 0 ? 'الادخار' : 'العجز'}</div><div class="num" style="font-size:19px;color:${net >= 0 ? 'var(--good)' : 'var(--bad)'}">${moneyTxt(Math.abs(net), 0)}</div></div>
        <div><div class="small muted">مقارنة بالفترة السابقة</div><div class="num" style="font-size:19px">${prev.exp ? `<span class="${exp > prev.exp ? 'delta-up' : 'delta-down'}">${exp > prev.exp ? '▲' : '▼'} ${fmt(Math.abs(((exp - prev.exp) / prev.exp) * 100), 0)}٪</span>` : '—'}</div></div>
      </div></div>
    <div class="card"><h2>الصرف التراكمي مقابل الميزانية</h2><div class="chart" id="ch-cum"></div>
      <div class="legend"><span><i></i>صرفك الفعلي</span><span><i class="dash"></i>الصرف المثالي حتى ${moneyTxt(state.profile.budget || 0, 0)}</span></div></div>
    <div class="card"><h2>المصروف في آخر ٦ فترات</h2><div class="chart" id="ch-months"></div>
      <div class="legend"><span><i class="bar"></i>ضمن الميزانية</span><span><i class="bad"></i>فوق الميزانية</span><span><i class="dash"></i>الميزانية</span></div></div>
    <div class="card"><h2>المصروف حسب الفئة</h2>${catBars(byCat, exp, 0, prev.byCat)}</div>
    <div class="card"><h2>أكثر الجهات صرفاً</h2>
      ${top.length ? `<div class="tbl"><table><thead><tr><th>الجهة</th><th class="n">عدد</th><th class="n">المبلغ</th></tr></thead><tbody>
      ${top.map(([k, m]) => `<tr><td>${CAT[m.cat]?.icon || ''} ${esc(k)}</td><td class="n">${fmt(m.n, 0)}</td><td class="n">${fmt(m.v)}</td></tr>`).join('')}</tbody></table></div>` : '<div class="empty">لا توجد بيانات</div>'}
    </div>`;
    drawCumulative($('#ch-cum'), p, list);

  }

  function svgEl(w, h, inner) { return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" role="img">${inner}</svg><div class="tip" hidden></div>`; }
  function niceMax(v) {
    if (v <= 0) return 100;
    const e = Math.pow(10, Math.floor(Math.log10(v))); const f = v / e;
    return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * e;
  }
  const shortNum = (v) => (v >= 1000 ? fmt(v / 1000, v % 1000 ? 1 : 0) + 'k' : fmt(v, 0));

  function attachTip(box, n, xAt, html) {
    const svg = box.querySelector('svg'), tip = box.querySelector('.tip'), cross = box.querySelector('.cross');
    const move = (ev) => {
      const r = svg.getBoundingClientRect();
      const x = ev.clientX - r.left;
      let best = 0, bd = Infinity;
      for (let i = 0; i < n; i++) { const d = Math.abs(xAt(i) - x); if (d < bd) { bd = d; best = i; } }
      const h = html(best); if (!h) { tip.hidden = true; return; }
      tip.innerHTML = h.text; tip.hidden = false;
      const tx = Math.max(70, Math.min(r.width - 70, xAt(best)));
      tip.style.left = (tx - tip.offsetWidth / 2) * 1 + 'px'; tip.style.transform = 'translate(0,-100%)';
      tip.style.top = Math.max(0, h.y - 8) + 'px';
      if (cross) { cross.setAttribute('x1', xAt(best)); cross.setAttribute('x2', xAt(best)); cross.style.opacity = 1; }
    };
    svg.addEventListener('pointermove', move);
    svg.addEventListener('pointerdown', move);
    svg.addEventListener('pointerleave', () => { tip.hidden = true; if (cross) cross.style.opacity = 0; });
  }

  function drawCumulative(box, p, list) {
    const W = Math.max(260, box.clientWidth), H = 200, padT = 14, padB = 24, padL = 8, padR = 40;
    const budget = state.profile.budget || 0;
    const daily = new Array(p.days).fill(0);
    list.forEach((t) => { if (t.type !== 'income') { const i = Math.floor((parseIso(t.date) - p.start) / 86400000); if (i >= 0 && i < p.days) daily[i] += t.amount; } });
    const el2 = elapsed(p);
    const lastIdx = el2.current ? el2.daysGone - 1 : p.days - 1;
    const cum = []; let s = 0;
    for (let i = 0; i <= lastIdx; i++) { s += daily[i]; cum.push(s); }
    const ymax = niceMax(Math.max(budget, s) * 1.05);
    // RTL: day 1 on the right, time flows leftwards like the page.
    const x = (i) => W - padR - (i / (p.days - 1)) * (W - padR - padL);
    const y = (v) => padT + (1 - v / ymax) * (H - padT - padB);
    let g = '';
    for (let k = 0; k <= 4; k++) { const v = (ymax / 4) * k; g += `<line class="grid" x1="${padL}" x2="${W - padR}" y1="${y(v)}" y2="${y(v)}"/><text x="${W - padR + 6}" y="${y(v) + 4}" text-anchor="start">${shortNum(v)}</text>`; }
    const ticks = [0, Math.floor((p.days - 1) / 3), Math.floor((2 * (p.days - 1)) / 3), p.days - 1];
    ticks.forEach((i) => { const d = new Date(p.start.getFullYear(), p.start.getMonth(), p.start.getDate() + i); g += `<text x="${x(i)}" y="${H - 6}" text-anchor="middle">${fmtDate(d, { day: 'numeric', month: 'short' })}</text>`; });
    const pace = budget ? `<line x1="${x(0)}" y1="${y(budget / p.days)}" x2="${x(p.days - 1)}" y2="${y(budget)}" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="5 4"/>` : '';
    const pts = cum.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
    const area = cum.length ? `<polygon points="${x(0)},${y(0)} ${pts} ${x(cum.length - 1)},${y(0)}" fill="var(--accent)" opacity=".12"/>` : '';
    const line = cum.length ? `<polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>` : '';
    const end = cum.length ? `<circle cx="${x(cum.length - 1)}" cy="${y(s)}" r="4.5" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/><text x="${x(cum.length - 1)}" y="${y(s) - 10}" text-anchor="middle" style="fill:var(--ink);font-weight:600">${shortNum(s)}</text>` : '';
    box.innerHTML = svgEl(W, H, `${g}<line class="base" x1="${padL}" x2="${W - padR}" y1="${y(0)}" y2="${y(0)}"/>${pace}${area}${line}<line class="cross" x1="0" x2="0" y1="${padT}" y2="${y(0)}" stroke="var(--muted)" stroke-width="1" style="opacity:0"/>${end}`);
    attachTip(box, cum.length, x, (i) => {
      const d = new Date(p.start.getFullYear(), p.start.getMonth(), p.start.getDate() + i);
      const ideal = budget ? (budget / p.days) * (i + 1) : 0;
      return { y: y(cum[i]), text: `<b>${fmtDate(d, { weekday: 'short', day: 'numeric', month: 'short' })}</b><br>هذا اليوم: ${moneyTxt(daily[i])}<br>التراكمي: ${moneyTxt(cum[i], 0)}${budget ? '<br>المثالي: ' + moneyTxt(ideal, 0) : ''}` };
    });
  }

  function drawMonths(box) {
    const W = Math.max(260, box.clientWidth), H = 190, padT = 18, padB = 24, padL = 8, padR = 40;
    const budget = state.profile.budget || 0;
    const data = [];
    for (let o = state.offset - 5; o <= state.offset; o++) { const p = periodAt(o); data.push({ p, v: sums(inPeriod(p)).exp, cur: o === state.offset }); }
    const ymax = niceMax(Math.max(budget, ...data.map((d) => d.v)) * 1.08);
    const n = data.length, slot = (W - padL - padR) / n, bw = Math.min(38, slot * 0.56);
    const cx = (i) => W - padR - slot * (i + 0.5); // RTL: oldest on the right
    const y = (v) => padT + (1 - v / ymax) * (H - padT - padB);
    let g = '';
    for (let k = 0; k <= 4; k++) { const v = (ymax / 4) * k; g += `<line class="grid" x1="${padL}" x2="${W - padR}" y1="${y(v)}" y2="${y(v)}"/><text x="${W - padR + 6}" y="${y(v) + 4}" text-anchor="start">${shortNum(v)}</text>`; }
    let bars = '';
    data.forEach((d, i) => {
      const over = budget && d.v > budget;
      const top = y(d.v), h = y(0) - top, r = Math.min(4, h / 2);
      const x0 = cx(i) - bw / 2;
      if (h > 0.5) bars += `<path d="M${x0},${y(0)} V${top + r} Q${x0},${top} ${x0 + r},${top} H${x0 + bw - r} Q${x0 + bw},${top} ${x0 + bw},${top + r} V${y(0)} Z" fill="${over ? 'var(--bad)' : 'var(--accent)'}" opacity="${d.cur ? 1 : 0.72}"/>`;
      const lab = startDay() === 1 ? fmtDate(d.p.start, { month: 'short' }) : fmtDate(d.p.start, { day: 'numeric', month: 'short' });
      bars += `<text x="${cx(i)}" y="${H - 6}" text-anchor="middle" style="${d.cur ? 'fill:var(--ink);font-weight:600' : ''}">${lab}</text>`;
      if (d.cur || over) bars += `<text x="${cx(i)}" y="${top - 5}" text-anchor="middle" style="fill:var(--ink);font-size:10.5px">${over ? '⚠ ' : ''}${shortNum(d.v)}</text>`;
    });
    const bl = budget ? `<line x1="${padL}" x2="${W - padR}" y1="${y(budget)}" y2="${y(budget)}" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="5 4"/>` : '';
    box.innerHTML = svgEl(W, H, `${g}${bars}<line class="base" x1="${padL}" x2="${W - padR}" y1="${y(0)}" y2="${y(0)}"/>${bl}`);
    attachTip(box, n, cx, (i) => {
      const d = data[i];
      const diff = budget ? d.v - budget : 0;
      return { y: y(d.v), text: `<b>${esc(periodLabel(d.p))}</b><br>المصروف: ${moneyTxt(d.v, 0)}${budget ? '<br>' + (diff > 0 ? 'فوق الميزانية بـ ' : 'أقل من الميزانية بـ ') + moneyTxt(Math.abs(diff), 0) : ''}` };
    });
  }

  // ----- settings -----
  function renderSettings(el) {
    const pr = state.profile;
    const cb = pr.catBudgets || {};
    const rules = Object.entries(pr.rules || {});
    const days = Array.from({ length: 28 }, (_, i) => i + 1);
    el.innerHTML = `
    <div class="card" style="display:grid;gap:12px"><h2 style="margin:0">الميزانية</h2>
      <div class="field"><label for="s-budget">ميزانية الشهر (ر.س)</label><input id="s-budget" type="text" inputmode="decimal" value="${esc(pr.budget)}"></div>
      <div class="field"><label for="s-start">يبدأ شهرك المالي يوم</label>
        <select id="s-start">${days.map((d) => `<option value="${d}" ${d === startDay() ? 'selected' : ''}>${d === 1 ? '1 (بداية الشهر الميلادي)' : d === 27 ? '27 (موعد رواتب القطاع الحكومي)' : d}</option>`).join('')}</select>
        <span class="small muted">إذا كان راتبك ينزل يوم 27، اختر 27 لتبدأ الميزانية مع الراتب.</span></div>
      <div class="field"><span class="lbl">شكل الأرقام</span><div class="segs">
        <button class="seg" data-digits="latn" aria-pressed="${pr.digits !== 'arab'}">123</button>
        <button class="seg" data-digits="arab" aria-pressed="${pr.digits === 'arab'}">١٢٣</button></div></div>
    </div>
    <details class="card"><summary>ميزانية لكل فئة (اختياري)</summary>
      <p class="small muted" style="margin-top:0">حدد سقفاً لأي فئة وسيظهر لك تنبيه عند الوصول إلى 80٪ منه. اترك الخانة فارغة لإلغائه.</p>
      <div class="set-list">${EXP_CATS.map((c) => `<div class="setrow"><span aria-hidden="true">${c.icon}</span><label for="cb-${c.id}">${esc(c.name)}</label><input id="cb-${c.id}" type="text" inputmode="decimal" data-cb="${c.id}" placeholder="—" value="${cb[c.id] ? esc(cb[c.id]) : ''}"></div>`).join('')}</div>
    </details>
    <details class="card" id="iphone"><summary>استخدامه على الآيفون</summary>
      <p class="small" style="margin-top:0">آبل لا تسمح لأي تطبيق بقراءة الرسائل تلقائياً، لذلك نستخدم طريقة النسخ واللصق. يستغرق ذلك ثوانٍ لكل رسالة:</p>
      <ol class="steps">
        <li><b>أضف التطبيق للشاشة الرئيسية:</b> افتح هذا الرابط في سفاري، اضغط زر المشاركة ثم «إضافة إلى الشاشة الرئيسية».</li>
        <li><b>عند وصول رسالة البنك:</b> اضغط مطولاً على الرسالة ← «نسخ».</li>
        <li><b>افتح التطبيق</b> ← زر ＋ ← الصق الرسالة ← «قراءة الرسائل» ← «حفظ».</li>
        <li><b>لتوفير الوقت:</b> اجمع رسائل اليوم أو الأسبوع والصقها كلها مرة واحدة، مع سطر فارغ بين كل رسالة والتي تليها. الرسائل المكررة تُكتشف تلقائياً.</li>
        <li><b>اختصار اختياري:</b> في تطبيق «الاختصارات» ← «الأتمتة» ← «رسالة» ← اختر مرسل البنك (مثل <span class="mono">AlRajhiBank</span>) ← أضف إجراء «نسخ إلى الحافظة» لمحتوى الرسالة ← «تشغيل فوري». بعدها يكفي أن تفتح التطبيق وتلصق.</li>
      </ol>
    </details>
    <details class="card"><summary>قواعد التصنيف المحفوظة (${fmt(rules.length, 0)})</summary>
      <p class="small muted" style="margin-top:0">عندما تغيّر فئة عملية وتختار «تذكّر»، يحفظ التطبيق القاعدة ويطبّقها على رسائل هذا المتجر مستقبلاً.</p>
      ${rules.length ? rules.map(([k, v]) => `<div class="rule"><span>${esc(k)} ← ${CAT[v]?.icon || ''} ${esc(CAT[v]?.name || v)}</span><button class="btn ghost" style="padding:4px 10px" data-delrule="${esc(k)}">حذف</button></div>`).join('') : '<div class="small muted">لا توجد قواعد بعد</div>'}
    </details>
    <div class="card" style="display:grid;gap:10px"><h2 style="margin:0">بياناتك</h2>
      <p class="small muted" style="margin:0">${state.mode === 'cloud' ? 'بياناتك محفوظة في حسابك على Claude بشكل خاص: لا يراها غيرك حتى لو شاركت الرابط، وتصلك على أي جهاز تفتح منه التطبيق.' : 'البيانات محفوظة في متصفح هذا الجهاز فقط. صدّرها بين فترة وأخرى كنسخة احتياطية.'}</p>
      <div class="btns"><button class="btn ghost" data-act="export" ${realTxns().length ? '' : 'disabled'}>تصدير Excel ‏(CSV)</button>
        ${state.confirmClear ? `<button class="btn danger" data-act="clear-yes">نعم، احذف كل شيء</button><button class="btn ghost" data-act="clear-no">إلغاء</button>` : `<button class="btn ghost" data-act="clear" ${realTxns().length ? '' : 'disabled'} style="color:var(--bad)">حذف كل العمليات</button>`}</div>
      <div class="btns"><button class="btn ghost" data-act="backup" ${realTxns().length ? '' : 'disabled'}>حفظ نسخة احتياطية</button>
        <label class="btn ghost" for="restore-file" style="cursor:pointer">استعادة نسخة</label><input id="restore-file" type="file" accept=".json,application/json" hidden></div>
      <div class="small muted">عدد العمليات المسجلة: ${fmt(realTxns().length, 0)}</div>
    </div>`;
  }

  // ----- edit sheet -----
  function renderSheet() {
    const host = $('#sheet');
    const e = state.editing;
    if (!e) { host.hidden = true; host.innerHTML = ''; return; }
    host.hidden = false;
    const t = e.t;
    host.innerHTML = `<div class="sheet-bg" data-act="close-sheet"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sh-title">
      <h3><span id="sh-title">${t.sample ? 'عملية توضيحية' : 'تعديل العملية'}</span><button class="iconbtn" data-act="close-sheet" aria-label="إغلاق">✕</button></h3>
      ${t.sample ? '<div class="banner sample small">هذه عملية من البيانات التوضيحية ولا يمكن تعديلها. أضف عملياتك الحقيقية لتبدأ.</div>' : ''}
      <div class="segs"><button class="seg" data-etype="expense" aria-pressed="${t.type === 'expense'}">مصروف</button><button class="seg" data-etype="income" aria-pressed="${t.type === 'income'}">دخل</button></div>
      <div class="row2">
        <div class="field"><label for="e-amount">المبلغ (ر.س)</label><input id="e-amount" type="text" inputmode="decimal" value="${esc(t.amount)}"></div>
        <div class="field"><label for="e-cat">الفئة</label>${catSelect(t.type, t.cat, 'id="e-cat"')}</div>
      </div>
      <div class="field"><label for="e-merchant">المتجر أو الوصف</label><input id="e-merchant" type="text" dir="auto" value="${esc(t.merchant)}"></div>
      <div class="row2">
        <div class="field"><label for="e-date">التاريخ والوقت</label><input id="e-date" type="datetime-local" value="${esc(t.date)}"></div>
        <div class="field"><label for="e-method">طريقة الدفع</label>${methodSelect(t.method, 'id="e-method"')}</div>
      </div>
      <div class="field"><label for="e-note">ملاحظة</label><input id="e-note" type="text" dir="auto" value="${esc(t.note || '')}"></div>
      ${t.merchant ? `<label class="check"><input type="checkbox" id="e-remember"> تذكّر هذه الفئة لكل عمليات «${esc(t.merchant)}»</label>` : ''}
      ${t.raw ? `<details><summary class="small muted">نص الرسالة الأصلية</summary><div class="small muted" dir="auto" style="white-space:pre-line">${esc(t.raw)}</div></details>` : ''}
      ${t.sample ? '' : `<div class="btns"><button class="btn" data-act="save-edit" style="flex:1">حفظ التعديل</button>
        ${e.confirmDel ? '<button class="btn danger" data-act="del-yes">تأكيد الحذف</button>' : '<button class="btn ghost" data-act="del" style="color:var(--bad)">حذف</button>'}</div>`}
    </div></div>`;
  }

  // ---------- actions ----------
  function readManualForm() {
    const m = state.manual; if (!m || !$('#m-amount')) return;
    m.amount = $('#m-amount').value; m.merchant = $('#m-merchant').value; m.date = $('#m-date').value || m.date; m.method = $('#m-method').value; m.note = $('#m-note').value;
  }
  function readParsedField(el) {
    const i = +el.dataset.pi, f = el.dataset.pf, r = state.parsed[i]; if (!r) return;
    if (f === 'amount') { const n = toNum(el.value); if (!isNaN(n)) r.amount = n; }
    else r[f] = el.value;
  }

  function doParse() {
    const raw = $('#sms-in').value;
    const msgs = splitMessages(raw);
    if (!msgs.length) { toast('الصق رسالة البنك أولاً'); return; }
    const hashes = knownHashes(), seen = new Set();
    state.parsed = msgs.map((s) => {
      const r = parseSms(s, { rules: state.profile.rules });
      if (r.ok) { r.dup = hashes.has(r.hash) || seen.has(r.hash); r.include = !r.dup; seen.add(r.hash); }
      return r;
    });
    render();
  }

  function saveParsed() {
    const list = state.parsed.filter((r) => r.ok && r.include && r.amount > 0).map((r) => ({
      id: uid(), type: r.type, amount: Math.round(r.amount * 100) / 100, cat: r.cat, merchant: (r.merchant || '').trim(), date: r.date,
      method: r.method || '', note: '', source: 'sms', hash: r.hash, raw: r.raw.slice(0, 600), bank: r.bank || '',
    }));
    if (!list.length) return;
    addTxns(list);
    state.parsed = []; if ($('#sms-in')) $('#sms-in').value = '';
    toast('تم حفظ ' + fmt(list.length, 0) + (list.length === 1 ? ' عملية' : ' عمليات'));
    state.tab = 'home'; state.offset = 0; render();
  }

  function saveManual() {
    readManualForm();
    const m = state.manual, amount = toNum(m.amount);
    if (!(amount > 0)) { toast('اكتب المبلغ'); $('#m-amount').focus(); return; }
    const cat = m.cat || (m.merchant ? categorize(m.merchant, '', m.type, state.profile.rules) : m.type === 'income' ? 'income_other' : 'other');
    addTxns([{ id: uid(), type: m.type, amount: Math.round(amount * 100) / 100, cat, merchant: m.merchant.trim(), date: m.date || iso(new Date()), method: m.method, note: m.note.trim(), source: 'manual' }]);
    state.manual = newManual(m.type);
    toast('تم حفظ العملية');
    state.tab = 'home'; state.offset = 0; render();
  }

  function saveEdit() {
    const e = state.editing, t = e.t;
    const amount = toNum($('#e-amount').value);
    if (!(amount > 0)) { toast('المبلغ غير صحيح'); return; }
    const patch = { type: t.type, amount: Math.round(amount * 100) / 100, cat: $('#e-cat').value, merchant: $('#e-merchant').value.trim(), date: $('#e-date').value || t.date, method: $('#e-method').value, note: $('#e-note').value.trim() };
    if ($('#e-remember') && $('#e-remember').checked && patch.merchant) {
      setProfile({ rules: { ...(state.profile.rules || {}), [normalizeMerchant(patch.merchant)]: patch.cat } });
    }
    updateTxn(t.id, patch);
    state.editing = null; toast('تم الحفظ'); render();
  }

  async function exportCsv() {
    const rows = [['التاريخ', 'النوع', 'المبلغ', 'الفئة', 'الجهة', 'طريقة الدفع', 'المصدر', 'ملاحظة']];
    realTxns().sort((a, b) => (a.date < b.date ? -1 : 1)).forEach((t) => rows.push([t.date.replace('T', ' '), t.type === 'income' ? 'دخل' : 'مصروف', t.amount, CAT[t.cat]?.name || t.cat, t.merchant, t.method, t.source === 'sms' ? 'رسالة' : 'يدوي', t.note || '']));
    const csv = '﻿' + rows.map((r) => r.map((v) => '"' + String(v ?? '').replace(/"/g, '""') + '"').join(',')).join('\r\n');
    await offerFile('mizaniyati-' + iso(new Date()).slice(0, 10) + '.csv', csv, 'text/csv');
  }

  // Save a file: the artifact viewer's downloads capability, else the phone's share sheet, else a plain download.
  async function offerFile(filename, text, type) {
    let dl = null;
    try { dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null; } catch (e) { dl = null; }
    if (dl) {
      try { await dl.save({ filename, data: text }); } catch (e) { if (e && e.code !== 'declined') toast('تعذّر حفظ الملف'); }
      return;
    }
    const blob = new Blob([text], { type });
    try {
      const file = new File([blob], filename, { type });
      if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: filename }); return; }
    } catch (e) { if (e && e.name === 'AbortError') return; }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  }

  function exportBackup() {
    const data = JSON.stringify({ app: 'mizaniyati', v: 1, at: new Date().toISOString(), profile: state.profile, months: state.months });
    offerFile('mizaniyati-backup-' + iso(new Date()).slice(0, 10) + '.json', data, 'application/json');
  }

  function importBackup(file) {
    const r = new FileReader();
    r.onload = () => {
      try {
        const d = JSON.parse(r.result);
        if (!d || d.app !== 'mizaniyati' || typeof d.months !== 'object') throw new Error('bad');
        const have = new Set(realTxns().map((t) => t.id));
        const list = Object.values(d.months).flat().filter((t) => t && t.id && !have.has(t.id) && t.date && t.amount > 0);
        if (d.profile) setProfile({ ...d.profile });
        if (list.length) addTxns(list);
        toast('تمت استعادة ' + fmt(list.length, 0) + ' عملية');
        render();
      } catch (e) { toast('الملف غير صالح — اختر ملف نسخة احتياطية من ميزانيتي'); }
    };
    r.readAsText(file);
  }

  function clearAll() {
    const keys = Object.keys(state.months);
    state.months = {};
    keys.forEach((k) => Store.saveMonth(k));
    if (state.mode !== 'cloud') Store.saveLocal();
    state.confirmClear = false; toast('تم حذف كل العمليات'); render();
  }

  document.addEventListener('click', (ev) => {
    const t = ev.target.closest('[data-go],[data-act],[data-edit],[data-ftype],[data-addmode],[data-mtype],[data-mcat],[data-digits],[data-delrule],[data-etype]');
    if (!t) return;
    const d = t.dataset;
    if (d.go) { if (state.tab === 'add') readManualForm(); state.tab = d.go; state.editing = null; render(); window.scrollTo(0, 0); return; }
    if (d.edit) { const tx = allTxns().find((x) => x.id === d.edit); if (tx) { state.editing = { t: { ...tx } }; renderSheet(); } return; }
    if (d.ftype !== undefined) { state.txFilter.type = d.ftype; render(); return; }
    if (d.addmode) { readManualForm(); state.addMode = d.addmode; render(); return; }
    if (d.mtype) { readManualForm(); state.manual.type = d.mtype; state.manual.cat = d.mtype === 'income' ? 'salary' : ''; render(); return; }
    if (d.mcat) { readManualForm(); state.manual.cat = state.manual.cat === d.mcat ? '' : d.mcat; render(); return; }
    if (d.digits) { setProfile({ digits: d.digits }); render(); return; }
    if (d.delrule) { const r = { ...(state.profile.rules || {}) }; delete r[d.delrule]; setProfile({ rules: r }); render(); return; }
    if (d.etype) {
      const e = state.editing; e.t = { ...e.t, amount: $('#e-amount').value, merchant: $('#e-merchant').value, date: $('#e-date').value, method: $('#e-method').value, note: $('#e-note').value, type: d.etype };
      e.t.cat = d.etype === 'income' ? (CAT[e.t.cat]?.kind === 'income' ? e.t.cat : 'income_other') : (CAT[e.t.cat]?.kind === 'expense' ? e.t.cat : 'other');
      renderSheet(); return;
    }
    switch (d.act) {
      case 'prev': state.offset--; render(); break;
      case 'next': if (state.offset < 0) { state.offset++; render(); } break;
      case 'parse': doParse(); break;
      case 'example': $('#sms-in').value = SMS_EXAMPLE; doParse(); break;
      case 'clear-sms': $('#sms-in').value = ''; state.parsed = []; render(); break;
      case 'save-parsed': saveParsed(); break;
      case 'save-manual': saveManual(); break;
      case 'close-sheet': if (ev.target === t) { state.editing = null; renderSheet(); } break;
      case 'save-edit': saveEdit(); break;
      case 'del': state.editing.confirmDel = true; renderSheet(); break;
      case 'del-yes': deleteTxn(state.editing.t.id); state.editing = null; toast('تم حذف العملية'); render(); break;
      case 'export': exportCsv(); break;
      case 'backup': exportBackup(); break;
      case 'clear': state.confirmClear = true; render(); break;
      case 'clear-no': state.confirmClear = false; render(); break;
      case 'clear-yes': clearAll(); break;
    }
  });

  document.addEventListener('input', (ev) => {
    const el = ev.target;
    if (el.id === 'tx-q') { state.txFilter.q = el.value; render(); return; }
    if (el.dataset.pf) { readParsedField(el); return; }
  });
  document.addEventListener('change', (ev) => {
    const el = ev.target;
    if (el.id === 'restore-file') { if (el.files && el.files[0]) importBackup(el.files[0]); el.value = ''; return; }
    if (el.id === 'tx-cat') { state.txFilter.cat = el.value; render(); return; }
    if (el.dataset.pinc !== undefined) { const r = state.parsed[+el.dataset.pinc]; r.include = el.checked; render(); return; }
    if (el.dataset.pf) { readParsedField(el); return; }
    if (el.id === 's-budget') { const n = toNum(el.value); if (n > 0) { setProfile({ budget: Math.round(n) }); toast('تم تحديث الميزانية'); } else el.value = state.profile.budget; return; }
    if (el.id === 's-start') { setProfile({ startDay: +el.value }); state.offset = 0; sampleCache = null; toast('تم تحديث بداية الشهر'); return; }
    if (el.dataset.cb) {
      const n = toNum(el.value); const cb = { ...(state.profile.catBudgets || {}) };
      if (n > 0) cb[el.dataset.cb] = Math.round(n); else delete cb[el.dataset.cb];
      setProfile({ catBudgets: cb }); return;
    }
  });
  document.addEventListener('keydown', (ev) => { if (ev.key === 'Escape' && state.editing) { state.editing = null; renderSheet(); } });
  let rz; window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { if (state.tab === 'reports') render(); }, 150); });

  if (location.hash === '#iphone') state.tab = 'settings';
  // First paint shows the layout (with marked sample data) while storage connects.
  state.mode = 'connecting';
  render();
  Store.init();
})();
</script>
